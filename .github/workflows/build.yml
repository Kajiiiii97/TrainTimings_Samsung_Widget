name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TrainTimings-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrainTimings-apk
          path: TrainTimings-*.apk

      # A release per push makes the APK easy to grab straight from the phone's browser.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Train Timings build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: TrainTimings-*.apk
